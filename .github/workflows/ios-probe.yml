# iOS port (added in this fork, 2026-11): one cheap job that shows what the macOS runner offers
# before the real iOS build runs on it.
name: iOS runner probe
permissions:
  contents: read
on:
  push:
    branches: [ ios-port ]
    paths: [ '.github/workflows/ios-probe.yml' ]
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Runner
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          df -h /
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          for t in python3 cmake ninja ccache gh jq; do printf '%s: ' "$t"; command -v "$t" || echo missing; done
